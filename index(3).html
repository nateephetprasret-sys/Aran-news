<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข่าวโรงเรียนอรัญประเทศ</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#277A3B"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ข่าวอรัญ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF5EE;--card:#fff;--ink:#1B2A1F;--sub:#56685B;--line:#D3E2D7;--blue:#277A3B;--blue-t:#DCEFE1;--yellow:#D9A21B;--red:#C62828;--green:#277A3B;--pink:#B03A86;--gray:#6A786F;--on-blue:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1710;--card:#15261A;--ink:#E8F4EA;--sub:#9DB5A2;--line:#24392A;--blue:#6FD08A;--blue-t:#1C3B27;--red:#FF7B7B;--green:#6FD08A;--pink:#F08BC3;--gray:#98A99D;--on-blue:#0C1710;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1710;--card:#15261A;--ink:#E8F4EA;--sub:#9DB5A2;--line:#24392A;--blue:#6FD08A;--blue-t:#1C3B27;--red:#FF7B7B;--green:#6FD08A;--pink:#F08BC3;--gray:#98A99D;--on-blue:#0C1710;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Sarabun,"Noto Sans Thai",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
h1,h2,h3,.f{font-family:Prompt,Sarabun,system-ui,sans-serif;font-weight:600;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
.phone{position:relative;width:100%;max-width:400px;height:100%;max-height:820px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){.phone{height:92%;border-radius:32px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(20,33,61,.18)}}
header{padding:16px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
header .sch{font-size:13px;color:var(--sub)}
header h1{font-size:26px;line-height:1.2}
.read-all{border:0;background:transparent;color:var(--blue);font-weight:600;padding:8px 4px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:0 14px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{position:relative;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 18px;margin-bottom:10px;cursor:pointer;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.card h3{font-size:16px;line-height:1.35;margin-bottom:2px}
.card p{margin:0;color:var(--sub);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.read h3{font-weight:500;color:var(--sub)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--sub)}
.tag{font-weight:600;color:var(--c)}
.dot{position:absolute;right:12px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 2px var(--card)}
.empty{text-align:center;color:var(--sub);padding:40px 20px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:transparent;padding:10px 4px 12px;cursor:pointer;color:var(--sub);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--blue);font-weight:600}
nav .b{position:relative}
nav .b i{position:absolute;top:-4px;right:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:600 11px/17px Prompt,sans-serif;font-style:normal;text-align:center;padding:0 4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h2{font-size:16px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row small{display:block;color:var(--sub);font-size:12.5px;line-height:1.3}
.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(18px)}
.sw:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
select{width:auto}
label.f2{display:block;font-weight:500;margin:10px 0 4px;font-size:14px}
textarea{min-height:110px;resize:vertical}
.btn{border:0;background:var(--blue);color:var(--on-blue);border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
.btn.alt{background:var(--blue-t);color:var(--blue)}
.push{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);border:0;text-align:left;width:calc(100% - 20px)}
.push.show{transform:none}
.push .ic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--yellow);color:#14213D;display:grid;place-items:center;font:600 13px Prompt}
.push b{display:block;font-size:12.5px;opacity:.7;font-weight:500}
.push span{display:block;font-weight:600;line-height:1.35}
.sheet{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 6px}
.sheet .body{flex:1;overflow-y:auto;padding:6px 18px 24px}
.sheet h2{font-size:22px;line-height:1.3;margin:8px 0 6px}
.sheet .txt{white-space:pre-wrap;font-size:16.5px}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600;color:#fff;background:var(--c)}
.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:500;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hb{display:flex;align-items:center;gap:12px}
.lg{width:44px;height:54px;object-fit:contain;flex:none}
header{border-bottom:2px solid var(--yellow);margin:0 14px 12px;padding:14px 4px 10px}
.push .ic{background:#fff}
.login{position:absolute;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(30px + env(safe-area-inset-top,0px)) 22px 24px;display:flex;flex-direction:column}
.login[hidden]{display:none}
.login h1{font-size:30px;line-height:1.2;margin:10px 0 2px}
.demo{display:grid;gap:8px}
.demo button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:500}
.demo small{display:block;color:var(--sub);font-size:12.5px;font-weight:400}
.err{color:var(--red);font-weight:500;min-height:22px;margin-top:8px}
.me{display:flex;align-items:center;gap:12px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;font:600 18px Prompt}
.btn.del{background:transparent;color:var(--red);border:1px solid var(--red);margin-top:24px}
.inb{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:9px 0;cursor:pointer}
.inb:first-of-type{border-top:0}
.inb small{color:var(--sub);font-size:12.5px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <button class="push" id="push" type="button" aria-live="polite"></button>
  <header id="hd"></header>
  <main id="main"></main>
  <nav>
    <button id="t-feed" onclick="go('feed')"><span class="b"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><i id="nb" hidden></i></span>ข่าวสาร</button>
    <button id="t-set" onclick="go('set')"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>แจ้งเตือน</button>
    <button id="t-post" onclick="go('post')"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5l4 4L8 20H4v-4z"/></svg>โพสต์ข่าว</button>
  </nav>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="login" id="login"><img class="lg" id="llogo" style="width:84px;height:104px" alt="ตราโรงเรียนอรัญประเทศ"><h1 id="ltitle">เข้าสู่ระบบ</h1><p style="color:var(--sub);margin:0 0 14px">โรงเรียนอรัญประเทศ</p>
<div id="regf" hidden><label class="f2" for="rn" style="margin-top:0">ชื่อ-นามสกุล</label><input type="text" id="rn" maxlength="60" autocomplete="name"><label class="f2" for="rg">ชั้นเรียน</label><select id="rg" style="width:100%"><option>ม.1</option><option>ม.2</option><option>ม.3</option><option>ม.4</option><option>ม.5</option><option>ม.6</option></select></div><label class="f2" for="lu">ชื่อผู้ใช้</label><input type="text" id="lu" autocomplete="username" autocapitalize="none">
<label class="f2" for="lp">รหัสผ่าน</label><input type="password" id="lp" autocomplete="current-password" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px" onkeydown="if(event.key==='Enter')submitForm()">
<div class="err" id="err" role="alert"></div><button class="btn" id="mainbtn" style="margin-top:4px" onclick="submitForm()">เข้าสู่ระบบ</button><button class="btn alt" id="swap" onclick="swapMode()">สมัครสมาชิกใหม่</button>
<p id="hint" style="color:var(--sub);font-size:14px;margin:18px 0 0">ถ้าลืมรหัสผ่านให้ติดต่อครูหรือผู้ดูแลระบบ</p></div>
<div class="toast" id="toast"></div>
</div>

const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const cat=n=>CATS[n.cat]||CATS.gen;

function when(d){if(!d)return 'เมื่อสักครู่';const t=new Date(),days=Math.round((new Date(t.toDateString())-new Date(d.toDateString()))/864e5);if(days<=0)return 'วันนี้ '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});if(days===1)return 'เมื่อวาน';return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}

function render(force){

function chip(k,l){return '<button class="chip" aria-pressed="'+(S.filter===k)+'" onclick="setF(\''+k+'\')">'+l+'</button>'}
function feed(){
  let h='<div class="chips" role="group" aria-label="กรองข่าว">'+chip('all','ทั้งหมด');
  for(const k in CATS)h+=chip(k,CATS[k].n);
  h+='</div>';
  const list=S.news.filter(n=>vis(n)&&(S.filter==='all'||n.cat===S.filter));
  if(!list.length)return h+'<div class="empty">ยังไม่มีข่าวในหมวดนี้</div>';
  list.forEach(n=>{const c=cat(n),r=S.read[n.id];

  return h;
}

  h+='<div class="panel"><h2>แจ้งเตือนล่าสุด</h2>';
  if(!S.inbox.length)h+='<small style="color:var(--sub)">ยังไม่มีแจ้งเตือนใหม่ในรอบนี้</small>';
  S.inbox.slice(0,5).forEach(i=>{h+='<button class="inb" onclick="openNews(\''+i.id+'\')"><span class="f" style="font-size:14.5px;font-weight:500">'+esc(i.title)+'</span><small>'+(CATS[i.cat]||CATS.gen).n+' • '+i.t+'</small></button>'});
  h+='</div><div class="panel"><h2>ชั้นเรียนของฉัน</h2><div class="row"><div>รับข่าวของชั้น<small>ข่าวของทุกชั้นจะได้รับเสมอ</small></div><select'+(U.role==='student'?' disabled':'')+' onchange="setGrade(this.value)" aria-label="ชั้นเรียน">';
  GRADES.forEach(g=>{h+='<option'+(g===S.grade?' selected':'')+'>'+g+'</option>'});
  h+='</select></div></div><div class="panel"><h2>ข่าวที่ให้เด้งเตือน</h2>';
  const d={urgent:'เปลี่ยนเวลา หยุดเรียน เหตุฉุกเฉิน',exam:'ตารางสอบ ประกาศคะแนน',event:'กีฬาสี ชมรม งานโรงเรียน',gen:'ประชุม ระเบียบ เรื่องทั่วไป'};
  for(const k in CATS)h+='<div class="row"><div>'+CATS[k].n+'<small>'+d[k]+'</small></div><input type="checkbox" class="sw" role="switch" aria-label="'+CATS[k].n+'" '+(S.cats[k]?'checked':'')+' onchange="setCat(\''+k+'\',this.checked)"></div>';
  h+='</div>';
  if(np==='default')h+='<button class="btn alt" onclick="askNotif()">เปิดแจ้งเตือนของเครื่อง</button><p class="empty" style="padding:8px 10px 0">เมื่อเปิดแล้ว ข่าวใหม่จะเด้งขึ้นเมื่อแอปเปิดค้างอยู่ในพื้นหลัง</p>';
  else if(np==='granted')h+='<p class="empty" style="padding:8px 10px 0">เปิดแจ้งเตือนของเครื่องแล้ว</p>';
  if(!window.matchMedia('(display-mode: standalone)').matches)h+='<div class="panel" style="margin-top:12px"><h2>ติดตั้งเป็นแอป</h2>'+(S.inst?'<button class="btn" style="margin-top:0" onclick="installApp()">ติดตั้งแอปลงเครื่อง</button>':'<small style="color:var(--sub)">Android: กดจุดสามจุดของ Chrome แล้วเลือก "ติดตั้งแอป" หรือ "เพิ่มลงในหน้าจอหลัก"<br>iPhone: กดปุ่มแชร์ใน Safari แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"</small>')+'</div>';
  return h;
}
function post(){
  let h='<div class="panel"><label class="f2" for="pt" style="margin-top:0">หัวข้อ</label><input type="text" id="pt" maxlength="80" placeholder="เช่น งดการเรียนการสอนวันศุกร์">';
  h+='<label class="f2" for="pb">รายละเอียด</label><textarea id="pb" placeholder="วัน เวลา สถานที่ และสิ่งที่นักเรียนต้องเตรียม"></textarea>';
  h+='<label class="f2" for="pc">หมวดข่าว</label><select id="pc" style="width:100%">';
  for(const k in CATS)if(k!=='urgent'||S.u.role==='director')h+='<option value="'+k+'">'+CATS[k].n+'</option>';
  h+='</select><label class="f2" for="pg">ส่งถึง</label><select id="pg" style="width:100%">';
  GRADES.forEach(g=>{h+='<option>'+g+'</option>'});
  return h+'</select><button class="btn" id="sendbtn" onclick="send()">ส่งประกาศ</button></div><p class="empty" style="padding:0 10px">'+(S.u.role==='director'?'ผู้อำนวยการส่งข่าวด่วนได้':'ข่าวด่วนส่งได้เฉพาะผู้อำนวยการ')+'</p>';
}
async function send(){
  if(!can('post'))return;
  const t=$('pt').value.trim(),b=$('pb').value.trim();
  if(!t||!b){toast('กรอกหัวข้อและรายละเอียดก่อนส่ง');return}
  const bt=$('sendbtn');bt.disabled=true;
  try{
    await addDoc(collection(db,'news'),{title:t,body:b,cat:$('pc').value,grade:$('pg').value,authorId:S.u.uid,authorName:S.u.name,createdAt:serverTimestamp()});
    toast('ส่งประกาศแล้ว');S.tab='feed';S.filter='all';render(true);
  }catch(e){toast('ส่งไม่สำเร็จ ('+(e.code||'error')+')');bt.disabled=false}
}
function openNews(id){
  const n=S.news.find(x=>x.id===id);if(!n)return;
  S.read[id]=1;ls('read_'+S.u.uid,S.read);const c=cat(n);
  $('sheet').innerHTML='<div class="top"><button class="read-all" onclick="closeSheet()">‹ กลับ</button></div><div class="body" style="--c:'+c.c+'"><span class="pill">'+c.n+'</span><h2>'+esc(n.title)+'</h2><div class="meta" style="margin:0 0 16px"><span>ถึง '+esc(n.grade)+'</span><span>'+when(n.at)+'</span><span>โดย '+esc(n.authorName||'โรงเรียน')+'</span></div><div class="txt">'+esc(n.body)+'</div>'+(can('del',n)?'<button class="btn del" onclick="del(\''+id+'\')">ลบประกาศนี้</button>':'')+'</div>';
  $('sheet').classList.add('open');render(true);
}
function closeSheet(){$('sheet').classList.remove('open')}
async function del(id){try{await deleteDoc(doc(db,'news',id));closeSheet();toast('ลบประกาศแล้ว')}catch(e){toast('ลบไม่สำเร็จ ('+(e.code||'error')+')')}}
function readAll(){S.news.forEach(n=>{if(vis(n))S.read[n.id]=1});ls('read_'+S.u.uid,S.read);render(true)}
function notify(n){
  if(!S.cats[n.cat]||!vis(n))return;
  S.inbox.unshift({id:n.id,title:n.title,cat:n.cat,t:when(n.at)});
  const p=$('push');
  p.innerHTML='<div class="ic"><img src="'+LOGO+'" alt="" style="width:24px;height:30px;object-fit:contain"></div><div><b>โรงเรียนอรัญประเทศ • '+cat(n).n+'</b><span>'+esc(n.title)+'</span></div>';
  p.onclick=()=>{p.classList.remove('show');openNews(n.id)};
  p.classList.add('show');clearTimeout(S.timer);S.timer=setTimeout(()=>p.classList.remove('show'),5000);
  if(document.hidden&&window.Notification&&Notification.permission==='granted'){try{new Notification('โรงเรียนอรัญประเทศ • '+cat(n).n,{body:n.title,icon:LOGO})}catch(e){}}
}
function listen(){
  S.first=true;
  S.unsub=onSnapshot(query(collection(db,'news'),orderBy('createdAt','desc'),limit(50)),snap=>{
    S.news=snap.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return {id:d.id,...x,at:x.createdAt&&x.createdAt.toDate?x.createdAt.toDate():null}});
    if(!S.first)snap.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites){const n=S.news.find(x=>x.id===c.doc.id);if(n&&n.authorId!==S.u.uid)notify(n)}});
    S.first=false;render();
  },e=>toast('โหลดข่าวไม่ได้ ('+(e.code||'error')+')'));
}
async function login(){
  let e=$('lu').value.trim().toLowerCase();const p=$('lp').value;
  if(!e||!p){$('err').textContent='กรอกชื่อผู้ใช้และรหัสผ่าน';return}
  if(e.indexOf('@')<0)e+='@school.aran';
  $('err').textContent='';
  try{await signInWithEmailAndPassword(auth,e,p)}catch(x){const bad=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'];$('err').textContent=bad.includes(x.code)?'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง':'เข้าสู่ระบบไม่ได้ ('+x.code+')'}
}

function swapMode(){const r=S.mode!=='reg';S.mode=r?'reg':'login';$('regf').hidden=!r;$('ltitle').textContent=r?'สมัครสมาชิก':'เข้าสู่ระบบ';$('mainbtn').textContent=r?'สมัครสมาชิก':'เข้าสู่ระบบ';$('swap').textContent=r?'มีบัญชีแล้ว เข้าสู่ระบบ':'สมัครสมาชิกใหม่';$('err').textContent='';$('hint').textContent=r?'สมัครแล้วจะเป็นยศนักเรียน (อ่านข่าวได้อย่างเดียว) ถ้าเป็นครูหรือผู้อำนวยการ ให้สมัครก่อนแล้วแจ้งผู้ดูแลให้เปลี่ยนยศ ชื่อผู้ใช้ใช้ตัวอักษรอังกฤษหรือตัวเลข เช่น s1001 รหัสผ่านอย่างน้อย 6 ตัว':'ถ้าลืมรหัสผ่านให้ติดต่อครูหรือผู้ดูแลระบบ'}
function submitForm(){if(S.mode==='reg')register();else login()}
async function register(){
  const name=$('rn').value.trim(),g=$('rg').value,p=$('lp').value;let e=$('lu').value.trim().toLowerCase();
  if(!name||!e||!p){$('err').textContent='กรอกข้อมูลให้ครบ';return}
  if(e.indexOf('@')<0){if(!/^[a-z0-9._-]{3,30}$/.test(e)){$('err').textContent='ชื่อผู้ใช้ใช้ได้เฉพาะตัวอักษรอังกฤษ ตัวเลข . _ - (3–30 ตัว)';return}e+='@school.aran'}
  if(p.length<6){$('err').textContent='รหัสผ่านต้องมีอย่างน้อย 6 ตัว';return}
  $('err').textContent='';S.reg=true;$('mainbtn').disabled=true;
  try{
    const c=await createUserWithEmailAndPassword(auth,e,p);
    await setDoc(doc(db,'users',c.user.uid),{name,role:'student',grade:g});
    S.reg=false;await boot(c.user);
  }catch(x){
    S.reg=false;
    $('err').textContent=x.code==='auth/email-already-in-use'?'ชื่อผู้ใช้นี้ถูกใช้แล้ว ลองชื่ออื่น':x.code==='auth/weak-password'?'รหัสผ่านง่ายเกินไป':'สมัครไม่ได้ ('+(x.code||'error')+')';
    if(auth.currentUser){try{await auth.currentUser.delete()}catch(_){}}
  }
  $('mainbtn').disabled=false;
}
function logout(){closeSheet();$('push').classList.remove('show');signOut(auth)}
function setF(k){S.filter=k;render(true)}
function setGrade(v){S.grade=v;render(true)}
function setCat(k,v){S.cats[k]=v;ls('cats_'+S.u.uid,S.cats)}
async function askNotif(){if(!window.Notification){toast('เครื่องนี้ไม่รองรับ');return}const r=await Notification.requestPermission();toast(r==='granted'?'เปิดแจ้งเตือนแล้ว':'ยังไม่ได้รับอนุญาต');render(true)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.u&&S.tab==='set')render(true)});
window.addEventListener('appinstalled',()=>{S.inst=null;toast('ติดตั้งแอปแล้ว')});
async function installApp(){if(!S.inst)return;S.inst.prompt();await S.inst.userChoice;S.inst=null;render(true)}
function go(t){S.tab=t;render(true)}
Object.assign(window,{installApp,swapMode,submitForm,go,login,logout,openNews,closeSheet,del,readAll,send,setF,setGrade,setCat,askNotif});
async function boot(u){
  if(S.unsub){S.unsub();S.unsub=null}
  if(!u){S.u=null;$('login').hidden=false;return}
  try{
    const s=await getDoc(doc(db,'users',u.uid));
    if(!s.exists()){await signOut(auth);$('err').textContent='บัญชีนี้ยังไม่ได้ตั้งยศ ให้ผู้ดูแลเพิ่มข้อมูลผู้ใช้ก่อน';return}
    const p=s.data();
    S.u={uid:u.uid,name:p.name||u.email,role:ROLE[p.role]?p.role:'student',grade:GRADES.includes(p.grade)?p.grade:'ทุกชั้น'};
  }catch(e){await signOut(auth);$('err').textContent='อ่านข้อมูลผู้ใช้ไม่ได้ ('+(e.code||'error')+')';return}
  S.read=ls('read_'+u.uid)||{};const c=ls('cats_'+u.uid);if(c)S.cats=Object.assign(S.cats,c);
  S.grade=S.u.grade;S.tab='feed';S.filter='all';S.inbox=[];
  $('login').hidden=true;$('lp').value='';$('err').textContent='';
  listen();render(true);
  if(S.mode==='reg')swapMode();
}
onAuthStateChanged(auth,u=>{if(S.reg)return;boot(u)});
$('llogo').src=LOGO;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
